<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meal &amp; Budget Planner</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <h1>🥘 Meal &amp; Budget Planner</h1>
    <p>Plan varied, calorie- and macro-tracked meals that fit your grocery budget.</p>
  </header>

  <main>
    <section class="panel">
      <h2>Settings</h2>
      <form id="planForm">
        <div class="form-row">
          <label for="days">Plan length (days)</label>
          <input type="number" id="days" min="1" max="14" value="7" required>
        </div>

        <div class="form-row">
          <label for="calories">Daily calorie target</label>
          <input type="number" id="calories" min="1000" max="5000" step="50" value="2000" required>
        </div>

        <div class="form-row macro-row">
          <label>Macro split (%) — protein / carbs / fat</label>
          <div class="macro-inputs">
            <input type="number" id="macroProtein" min="0" max="100" value="30" required>
            <input type="number" id="macroCarbs" min="0" max="100" value="40" required>
            <input type="number" id="macroFat" min="0" max="100" value="30" required>
          </div>
        </div>

        <div class="form-row">
          <label for="snacks">Snacks per day</label>
          <select id="snacks">
            <option value="1">1</option>
            <option value="2" selected>2</option>
          </select>
        </div>

        <div class="form-row">
          <label for="budgetPeriod">Grocery budget period</label>
          <select id="budgetPeriod">
            <option value="daily">Daily</option>
            <option value="weekly" selected>Weekly</option>
            <option value="monthly">Monthly</option>
          </select>
        </div>

        <div class="form-row">
          <label for="budgetAmount">Budget amount ($)</label>
          <input type="number" id="budgetAmount" min="1" step="1" value="75" required>
        </div>

        <div class="form-row checkbox-row">
          <label><input type="checkbox" id="vegetarian"> Vegetarian only</label>
        </div>

        <button type="submit" class="primary-btn">Generate Plan</button>
      </form>
    </section>

    <section id="results" class="panel hidden">
      <div class="results-head">
        <h2>Your Plan</h2>
        <button id="regenerateBtn" class="secondary-btn">🔀 Shuffle for more variety</button>
      </div>

      <div id="planMeta" class="meta-grid"></div>

      <div id="dayTabs" class="day-tabs"></div>
      <div id="dayViews"></div>

      <h3>Weekly Shopping List</h3>
      <div id="shoppingList"></div>
    </section>
  </main>

  <footer>
    <p>Grocery prices are national averages, not live store data — edit <code>js/foods.js</code> to match your local prices.</p>
  </footer>

  <script src="js/foods.js"></script>
  <script src="js/meals.js"></script>
  <script src="js/planner.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
